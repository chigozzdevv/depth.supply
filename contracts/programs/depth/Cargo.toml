[package]
name = "depth"
version = "0.1.0"
description = "Depth confidential perpetual trading program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "depth"

[features]
default = []
devnet = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "arcium-anchor/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
arcium-client = { default-features = false, version = "=0.13.2" }
arcium-macros = "=0.13.2"
arcium-anchor = "=0.13.2"
anchor-spl = { version = "=1.0.2", features = ["token"] }
sha3 = { version = "0.10", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
