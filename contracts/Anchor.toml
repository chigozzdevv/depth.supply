[toolchain]
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
depth = "5cE5Kc42mwvg931PfNfs224RuBr47JRk3VqgTSyEV7MS"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "target/test-wallet.json"

[scripts]
test = "pnpm exec ts-mocha -r tsconfig-paths/register -p ./tsconfig.json -t 1000000 tests/${DEPTH_TEST_FILE:-base}.ts"

[test]
upgradeable = true
startup_wait = 60000

